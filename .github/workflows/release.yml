name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.2.3 or v1.2.3)"
        required: true
        type: string
      target_commitish:
        description: "Commit, branch, or tag to release (example: 66d3df8 or main)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark this as a prerelease"
        required: false
        default: false
        type: boolean
      prerelease_tag:
        description: "Floating prerelease tag name"
        required: false
        default: pre-release
        type: string
      stable_tag:
        description: "Floating stable tag name"
        required: false
        default: stable
        type: string
      latest_tag:
        description: "Floating latest tag name"
        required: false
        default: latest
        type: string
      update_stable_tag:
        description: "Move the stable floating tag to this release"
        required: false
        default: false
        type: boolean
      update_prerelease_tag:
        description: "Move the prerelease floating tag to this release"
        required: false
        default: false
        type: boolean
      update_latest_tag:
        description: "Move the latest floating tag to this release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail

          bool_or_default() {
            local raw="$1"
            local fallback="$2"
            local v="${raw:-$fallback}"
            case "${v,,}" in
              true|1|yes|y) echo "true" ;;
              false|0|no|n) echo "false" ;;
              *) echo "$fallback" ;;
            esac
          }

          resolve_commitish() {
            local c="$1"

            if git rev-parse --verify "${c}^{commit}" >/dev/null 2>&1; then
              git rev-parse --verify "${c}^{commit}"
              return 0
            fi

            if git rev-parse --verify "origin/${c}^{commit}" >/dev/null 2>&1; then
              git rev-parse --verify "origin/${c}^{commit}"
              return 0
            fi

            git fetch --no-tags origin "$c" >/dev/null 2>&1 || true
            if git rev-parse --verify "FETCH_HEAD^{commit}" >/dev/null 2>&1; then
              git rev-parse --verify "FETCH_HEAD^{commit}"
              return 0
            fi

            return 1
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
            # Accept either 1.2.3 / 1.2.3-rc.1 or v1.2.3 / V1.2.3-rc.1.
            NORMALIZED_VERSION="${RAW_VERSION#v}"
            NORMALIZED_VERSION="${NORMALIZED_VERSION#V}"

            [[ "$NORMALIZED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
              echo "Invalid version '${RAW_VERSION}'. Expected semver-like value such as 1.2.3, v1.2.3, or v1.2.3-rc.1" >&2
              exit 1
            }

            TAG="v${NORMALIZED_VERSION}"
            TARGET_COMMITISH="${{ github.event.inputs.target_commitish }}"
            TARGET_COMMITISH="${TARGET_COMMITISH:-${GITHUB_SHA}}"

            PRERELEASE="${{ github.event.inputs.prerelease }}"
            PRERELEASE_TAG="${{ github.event.inputs.prerelease_tag }}"
            STABLE_TAG="${{ github.event.inputs.stable_tag }}"
            LATEST_TAG="${{ github.event.inputs.latest_tag }}"
            UPDATE_STABLE_TAG="$(bool_or_default "${{ github.event.inputs.update_stable_tag }}" "true")"
            UPDATE_PRERELEASE_TAG="$(bool_or_default "${{ github.event.inputs.update_prerelease_tag }}" "false")"
            UPDATE_LATEST_TAG="$(bool_or_default "${{ github.event.inputs.update_latest_tag }}" "true")"
            
            if [[ "$PRERELEASE" != "true" ]]; then
              UPDATE_PRERELEASE_TAG="false"
            fi
          else
            TAG="${GITHUB_REF_NAME}"
            TARGET_COMMITISH="${GITHUB_SHA}"
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi

            PRERELEASE_TAG="pre-release"
            STABLE_TAG="stable"
            LATEST_TAG="latest"
            UPDATE_STABLE_TAG="true"
            UPDATE_PRERELEASE_TAG="true"
            UPDATE_LATEST_TAG="true"

            # Optional repository-level defaults for push-triggered releases.
            if [[ -f ".github/release-tags.env" ]]; then
              # shellcheck source=/dev/null
              source .github/release-tags.env
            fi

            PRERELEASE_TAG="${PRERELEASE_TAG:-pre-release}"
            STABLE_TAG="${STABLE_TAG:-stable}"
            LATEST_TAG="${LATEST_TAG:-latest}"
            UPDATE_STABLE_TAG="$(bool_or_default "${UPDATE_STABLE_TAG:-true}" "true")"
            UPDATE_PRERELEASE_TAG="$(bool_or_default "${UPDATE_PRERELEASE_TAG:-true}" "true")"
            UPDATE_LATEST_TAG="$(bool_or_default "${UPDATE_LATEST_TAG:-true}" "true")"

            if [[ "$PRERELEASE" != "true" ]]; then
              UPDATE_PRERELEASE_TAG="false"
            fi
          fi

          if ! TARGET_COMMITISH="$(resolve_commitish "$TARGET_COMMITISH")"; then
            echo "Invalid target_commitish '${TARGET_COMMITISH}'. Provide a valid commit SHA, branch, or tag." >&2
            exit 1
          fi

          # GitHub "Latest" designation is separate from floating tags.
          if [[ "$PRERELEASE" == "true" ]]; then
            MAKE_LATEST="false"
          elif [[ "$UPDATE_LATEST_TAG" == "true" ]]; then
            MAKE_LATEST="true"
          else
            MAKE_LATEST="false"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "target_commitish=$TARGET_COMMITISH" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "prerelease_tag=$PRERELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "update_stable_tag=$UPDATE_STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "update_prerelease_tag=$UPDATE_PRERELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "update_latest_tag=$UPDATE_LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "make_latest=$MAKE_LATEST" >> "$GITHUB_OUTPUT"

          echo "Resolved release metadata:"
          echo "  tag=$TAG"
          echo "  target_commitish=$TARGET_COMMITISH"
          echo "  prerelease=$PRERELEASE"
          echo "  update_stable_tag=$UPDATE_STABLE_TAG"
          echo "  update_prerelease_tag=$UPDATE_PRERELEASE_TAG"
          echo "  update_latest_tag=$UPDATE_LATEST_TAG"
          echo "  make_latest=$MAKE_LATEST"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_TAG_PUSH_TOKEN != '' && secrets.RELEASE_TAG_PUSH_TOKEN || github.token }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ steps.meta.outputs.target_commitish }}
          name: Release ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}

      - name: Move floating tags
        if: ${{ steps.meta.outputs.update_stable_tag == 'true' || steps.meta.outputs.update_prerelease_tag == 'true' || steps.meta.outputs.update_latest_tag == 'true' }}
        env:
          RELEASE_TAG_PUSH_TOKEN: ${{ secrets.RELEASE_TAG_PUSH_TOKEN }}
          TARGET_COMMITISH: ${{ steps.meta.outputs.target_commitish }}
          TARGET_TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE_TAG: ${{ steps.meta.outputs.prerelease_tag }}
          STABLE_TAG: ${{ steps.meta.outputs.stable_tag }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          UPDATE_STABLE_TAG: ${{ steps.meta.outputs.update_stable_tag }}
          UPDATE_PRERELEASE_TAG: ${{ steps.meta.outputs.update_prerelease_tag }}
          UPDATE_LATEST_TAG: ${{ steps.meta.outputs.update_latest_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUSH_REMOTE="origin"
          if [[ "${UPDATE_STABLE_TAG}" == "true" || "${UPDATE_PRERELEASE_TAG}" == "true" || "${UPDATE_LATEST_TAG}" == "true" ]]; then
            if [[ -z "${RELEASE_TAG_PUSH_TOKEN:-}" ]]; then
              echo "Floating tag updates require RELEASE_TAG_PUSH_TOKEN secret (contents+workflows write)." >&2
              echo "Disable update_stable_tag/update_latest_tag for this run or add the secret." >&2
              exit 1
            fi
          fi

          if [[ -n "${RELEASE_TAG_PUSH_TOKEN:-}" ]]; then
            PUSH_REMOTE="https://x-access-token:${RELEASE_TAG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          # Ensure checkout's default token header cannot override PAT-based pushes.
          git config --local --unset-all http.https://github.com/.extraheader || true

          move_tag() {
            local floating_tag="$1"
            [[ -n "$floating_tag" ]] || return 0
            git tag -fa "$floating_tag" "$TARGET_COMMITISH" -m "Move $floating_tag -> $TARGET_TAG ($TARGET_COMMITISH)"
            if ! git push "$PUSH_REMOTE" "refs/tags/$floating_tag" --force; then
              echo "Failed to move floating tag '$floating_tag' to '$TARGET_TAG'." >&2
              echo "If this release points to commits that modify files under .github/workflows/," >&2
              echo "set repository secret RELEASE_TAG_PUSH_TOKEN to a token with workflows+contents write permissions." >&2
              exit 1
            fi
          }

          if [[ "${UPDATE_STABLE_TAG}" == "true" ]]; then
            move_tag "$STABLE_TAG"
          fi

          if [[ "${UPDATE_PRERELEASE_TAG}" == "true" ]]; then
            move_tag "$PRERELEASE_TAG"
          fi

          if [[ "${UPDATE_LATEST_TAG}" == "true" ]]; then
            move_tag "$LATEST_TAG"
          fi

      - name: Verify floating tag targets
        if: ${{ steps.meta.outputs.update_stable_tag == 'true' || steps.meta.outputs.update_prerelease_tag == 'true' || steps.meta.outputs.update_latest_tag == 'true' }}
        env:
          PRERELEASE_TAG: ${{ steps.meta.outputs.prerelease_tag }}
          STABLE_TAG: ${{ steps.meta.outputs.stable_tag }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          UPDATE_STABLE_TAG: ${{ steps.meta.outputs.update_stable_tag }}
          UPDATE_PRERELEASE_TAG: ${{ steps.meta.outputs.update_prerelease_tag }}
          UPDATE_LATEST_TAG: ${{ steps.meta.outputs.update_latest_tag }}
        run: |
          set -euo pipefail

          resolve_remote_tag_sha() {
            local t="$1"
            local peeled=""
            local plain=""

            peeled="$(git ls-remote --refs --tags origin "refs/tags/${t}^{}" | awk '{print $1}')"
            if [[ -n "$peeled" ]]; then
              echo "$peeled"
              return 0
            fi

            plain="$(git ls-remote --refs --tags origin "refs/tags/${t}" | awk '{print $1}')"
            if [[ -n "$plain" ]]; then
              echo "$plain"
              return 0
            fi

            echo "missing"
          }

          print_tag_state() {
            local label="$1"
            local tag_name="$2"
            local enabled="$3"

            if [[ "$enabled" != "true" ]]; then
              echo "$label ($tag_name): skipped"
              return 0
            fi

            echo "$label ($tag_name): $(resolve_remote_tag_sha "$tag_name")"
          }

          echo "Floating tag targets on remote after update:"
          print_tag_state "stable" "$STABLE_TAG" "$UPDATE_STABLE_TAG"
          print_tag_state "pre-release" "$PRERELEASE_TAG" "$UPDATE_PRERELEASE_TAG"
          print_tag_state "latest" "$LATEST_TAG" "$UPDATE_LATEST_TAG"
