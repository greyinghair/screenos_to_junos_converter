name: Release

on:
  pull_request:
    branches: [main]
    paths:
      - ".dockerignore"
      - ".github/workflows/release.yml"
      - "convert.py"
      - "docker/**"
      - "packages/**"
      - "pyproject.toml"
      - "requirements*.txt"
      - "scripts/container-smoke.sh"
      - "scripts/validate.sh"
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.2.3 or v1.2.3)"
        required: true
        type: string
      target_commitish:
        description: "Commit, branch, or tag to release (example: 66d3df8 or main)"
        required: false
        default: ""
        type: string
      prerelease:
        description: "Mark this as a prerelease"
        required: false
        default: false
        type: boolean
      prerelease_tag:
        description: "Floating prerelease tag name"
        required: false
        default: pre-release
        type: string
      stable_tag:
        description: "Floating stable tag name"
        required: false
        default: stable
        type: string
      latest_tag:
        description: "Floating latest tag name"
        required: false
        default: latest
        type: string
      update_stable_tag:
        description: "Move the stable floating tag to this release"
        required: false
        default: false
        type: boolean
      update_prerelease_tag:
        description: "Move the prerelease floating tag to this release"
        required: false
        default: false
        type: boolean
      update_latest_tag:
        description: "Move the latest floating tag to this release"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve release target
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      requested_target: ${{ steps.meta.outputs.requested_target }}
      target_sha: ${{ steps.meta.outputs.target_sha }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      prerelease_tag: ${{ steps.meta.outputs.prerelease_tag }}
      stable_tag: ${{ steps.meta.outputs.stable_tag }}
      latest_tag: ${{ steps.meta.outputs.latest_tag }}
      update_stable_tag: ${{ steps.meta.outputs.update_stable_tag }}
      update_prerelease_tag: ${{ steps.meta.outputs.update_prerelease_tag }}
      update_latest_tag: ${{ steps.meta.outputs.update_latest_tag }}
      make_latest: ${{ steps.meta.outputs.make_latest }}

    steps:
      - name: Checkout release workflow source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve immutable release metadata
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          CURRENT_REF_NAME: ${{ github.ref_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TARGET: ${{ inputs.target_commitish }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          INPUT_STABLE_TAG: ${{ inputs.stable_tag }}
          INPUT_LATEST_TAG: ${{ inputs.latest_tag }}
          INPUT_UPDATE_STABLE: ${{ inputs.update_stable_tag }}
          INPUT_UPDATE_PRERELEASE: ${{ inputs.update_prerelease_tag }}
          INPUT_UPDATE_LATEST: ${{ inputs.update_latest_tag }}
        run: |
          set -euo pipefail

          bool_or_default() {
            local raw="$1"
            local fallback="$2"
            local value="${raw:-$fallback}"
            case "${value,,}" in
              true|1|yes|y) echo "true" ;;
              false|0|no|n) echo "false" ;;
              *) echo "$fallback" ;;
            esac
          }

          resolve_commitish() {
            local requested="$1"

            [[ "$requested" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ ]] || return 1
            [[ "$requested" != *..* && "$requested" != *@\{* ]] || return 1

            if git rev-parse --verify --end-of-options "${requested}^{commit}" >/dev/null 2>&1; then
              git rev-parse --verify --end-of-options "${requested}^{commit}"
              return 0
            fi

            if git rev-parse --verify --end-of-options "origin/${requested}^{commit}" >/dev/null 2>&1; then
              git rev-parse --verify --end-of-options "origin/${requested}^{commit}"
              return 0
            fi

            git fetch --no-tags origin "$requested" >/dev/null 2>&1 || true
            if git rev-parse --verify "FETCH_HEAD^{commit}" >/dev/null 2>&1; then
              git rev-parse --verify "FETCH_HEAD^{commit}"
              return 0
            fi

            return 1
          }

          validate_tag_name() {
            local tag_name="$1"
            [[ -n "$tag_name" && "$tag_name" != -* ]] || return 1
            git check-ref-format "refs/tags/$tag_name"
          }

          validate_image_tag() {
            local tag_name="$1"
            [[ "$tag_name" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
          }

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            tag="validation-only"
            requested_target="$PR_HEAD_SHA"
            prerelease="true"
            prerelease_tag="pre-release"
            stable_tag="stable"
            latest_tag="latest"
            update_stable_tag="false"
            update_prerelease_tag="false"
            update_latest_tag="false"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            normalized_version="${INPUT_VERSION#v}"
            normalized_version="${normalized_version#V}"
            [[ "$normalized_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
              echo "Invalid version '$INPUT_VERSION'." >&2
              exit 1
            }

            tag="v${normalized_version}"
            requested_target="${INPUT_TARGET:-$CURRENT_SHA}"
            prerelease="$(bool_or_default "$INPUT_PRERELEASE" "false")"
            prerelease_tag="${INPUT_PRERELEASE_TAG:-pre-release}"
            stable_tag="${INPUT_STABLE_TAG:-stable}"
            latest_tag="${INPUT_LATEST_TAG:-latest}"
            update_stable_tag="$(bool_or_default "$INPUT_UPDATE_STABLE" "false")"
            update_prerelease_tag="$(bool_or_default "$INPUT_UPDATE_PRERELEASE" "false")"
            update_latest_tag="$(bool_or_default "$INPUT_UPDATE_LATEST" "true")"
          else
            tag="$CURRENT_REF_NAME"
            requested_target="$CURRENT_REF_NAME"
            if [[ "$tag" == *-* ]]; then
              prerelease="true"
            else
              prerelease="false"
            fi

            prerelease_tag="pre-release"
            stable_tag="stable"
            latest_tag="latest"
            update_stable_tag="true"
            update_prerelease_tag="true"
            update_latest_tag="true"

            if [[ -f ".github/release-tags.env" ]]; then
              # shellcheck source=/dev/null
              source .github/release-tags.env
            fi

            prerelease_tag="${PRERELEASE_TAG:-$prerelease_tag}"
            stable_tag="${STABLE_TAG:-$stable_tag}"
            latest_tag="${LATEST_TAG:-$latest_tag}"
            update_stable_tag="$(bool_or_default "${UPDATE_STABLE_TAG:-$update_stable_tag}" "true")"
            update_prerelease_tag="$(bool_or_default "${UPDATE_PRERELEASE_TAG:-$update_prerelease_tag}" "true")"
            update_latest_tag="$(bool_or_default "${UPDATE_LATEST_TAG:-$update_latest_tag}" "true")"
          fi

          if [[ "$prerelease" == "true" ]]; then
            update_stable_tag="false"
            update_latest_tag="false"
          else
            update_prerelease_tag="false"
          fi

          for tag_name in "$tag" "$prerelease_tag" "$stable_tag" "$latest_tag"; do
            if ! validate_tag_name "$tag_name"; then
              echo "Invalid tag name '$tag_name'." >&2
              exit 1
            fi
            if ! validate_image_tag "$tag_name"; then
              echo "Tag '$tag_name' is not valid for a container image." >&2
              exit 1
            fi
          done

          for channel_tag in "$prerelease_tag" "$stable_tag" "$latest_tag"; do
            if [[ "$channel_tag" == "$tag" || \
                  "$channel_tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ || \
                  "$channel_tag" =~ ^sha-[0-9a-f]{7,64}$ ]]; then
              echo "Floating channel '$channel_tag' must not be an immutable image tag." >&2
              exit 1
            fi
          done
          if [[ "$prerelease_tag" == "$stable_tag" || \
                "$prerelease_tag" == "$latest_tag" || \
                "$stable_tag" == "$latest_tag" ]]; then
            echo "Floating channel tag names must be distinct." >&2
            exit 1
          fi

          if ! target_sha="$(resolve_commitish "$requested_target")"; then
            echo "Invalid target_commitish '$requested_target'." >&2
            exit 1
          fi

          if [[ "$prerelease" == "true" ]]; then
            make_latest="false"
          elif [[ "$update_latest_tag" == "true" ]]; then
            make_latest="true"
          else
            make_latest="false"
          fi

          {
            echo "tag=$tag"
            echo "requested_target=$requested_target"
            echo "target_sha=$target_sha"
            echo "prerelease=$prerelease"
            echo "prerelease_tag=$prerelease_tag"
            echo "stable_tag=$stable_tag"
            echo "latest_tag=$latest_tag"
            echo "update_stable_tag=$update_stable_tag"
            echo "update_prerelease_tag=$update_prerelease_tag"
            echo "update_latest_tag=$update_latest_tag"
            echo "make_latest=$make_latest"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Resolved release target"
            echo
            echo "- Requested target: \`$requested_target\`"
            echo "- Immutable SHA: \`$target_sha\`"
            echo "- Release tag: \`$tag\`"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    name: Validate release target
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout current validation contract
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: validation-contract
          persist-credentials: false

      - name: Checkout resolved release target
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          path: target
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            target/requirements.txt
            validation-contract/requirements-dev.txt
            validation-contract/requirements-dev-latest.txt

      - name: Install validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r target/requirements.txt \
            -r validation-contract/requirements-dev.txt \
            -c validation-contract/requirements-dev-latest.txt
          python -m pip check

      - name: Run the required validation contract
        working-directory: target
        run: ../validation-contract/scripts/validate.sh all

      - name: Upload failed release validation diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-validation-${{ needs.resolve.outputs.target_sha }}
          path: target/artifacts/
          if-no-files-found: warn

      - name: Record validation result
        if: always()
        env:
          REQUESTED_TARGET: ${{ needs.resolve.outputs.requested_target }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          VALIDATION_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Release validation"
            echo
            echo "- Requested target: \`$REQUESTED_TARGET\`"
            echo "- Tested SHA: \`$TARGET_SHA\`"
            echo "- Result: **$VALIDATION_RESULT**"
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Create immutable release tag
    if: github.event_name != 'pull_request'
    needs:
      - resolve
      - validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create or verify immutable version tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          TARGET_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          checked_out_sha="$(git rev-parse HEAD)"
          [[ "$checked_out_sha" == "$TARGET_SHA" ]] || {
            echo "Checkout mismatch: expected $TARGET_SHA, got $checked_out_sha." >&2
            exit 1
          }

          remote_sha="$(git ls-remote --tags origin "refs/tags/${TARGET_TAG}^{}" | awk '{print $1}')"
          if [[ -z "$remote_sha" ]]; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TARGET_TAG}" | awk '{print $1}')"
          fi

          if [[ -n "$remote_sha" && "$remote_sha" != "$TARGET_SHA" ]]; then
            echo "Release tag $TARGET_TAG already points to $remote_sha, expected $TARGET_SHA." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "workflow_dispatch" && -z "$remote_sha" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a -m "Release $TARGET_TAG ($TARGET_SHA)" \
              -- "$TARGET_TAG" "$TARGET_SHA"
            push_remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push "$push_remote" "refs/tags/$TARGET_TAG"
          fi

          remote_sha="$(git ls-remote --tags origin "refs/tags/${TARGET_TAG}^{}" | awk '{print $1}')"
          if [[ -z "$remote_sha" ]]; then
            remote_sha="$(git ls-remote --tags origin "refs/tags/${TARGET_TAG}" | awk '{print $1}')"
          fi
          [[ "$remote_sha" == "$TARGET_SHA" ]] || {
            echo "Release tag $TARGET_TAG points to $remote_sha, expected $TARGET_SHA." >&2
            exit 1
          }

  container:
    name: Publish validated container
    if: github.event_name != 'pull_request'
    needs:
      - resolve
      - validate
      - tag
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: container-release-${{ needs.resolve.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/greyinghair/screenos_to_junos_converter
    outputs:
      image_digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate release image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.target_sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.tag }}

      - name: Build exact local release candidate
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          push: false
          no-cache: true
          tags: screenos-to-junos:release-candidate
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.resolve.outputs.tag }}

      - name: Validate CLI and web runtime before publication
        run: scripts/container-smoke.sh screenos-to-junos:release-candidate

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish the tested image without replacing immutable tags
        id: publish
        env:
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          TARGET_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail

          set +e
          pull_output="$(docker pull "$IMAGE_NAME:$TARGET_TAG" 2>&1)"
          pull_status=$?
          set -e

          if [[ "$pull_status" -eq 0 ]]; then
            existing_revision="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$IMAGE_NAME:$TARGET_TAG")"
            [[ "$existing_revision" == "$TARGET_SHA" ]] || {
              echo "Immutable image tag $TARGET_TAG belongs to $existing_revision, not $TARGET_SHA." >&2
              exit 1
            }
            created="false"
          else
            if ! grep -Eqi 'manifest unknown|not found' <<< "$pull_output"; then
              echo "$pull_output" >&2
              echo "Could not safely determine whether $IMAGE_NAME:$TARGET_TAG exists." >&2
              exit 1
            fi
            docker tag screenos-to-junos:release-candidate "$IMAGE_NAME:$TARGET_TAG"
            docker push "$IMAGE_NAME:$TARGET_TAG"
            created="true"
          fi

          digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$TARGET_TAG" \
            | awk '$1 == "Digest:" {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Could not resolve the published image digest." >&2
            exit 1
          }
          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke test the exact registry digest
        run: scripts/container-smoke.sh ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}

      - name: Apply immutable SHA alias
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
        run: |
          set -euo pipefail

          remote_digest() {
            local image_ref="$1"
            local inspect_output
            local inspect_status
            set +e
            inspect_output="$(docker buildx imagetools inspect "$image_ref" 2>&1)"
            inspect_status=$?
            set -e
            if [[ "$inspect_status" -eq 0 ]]; then
              awk '$1 == "Digest:" {print $2; exit}' <<< "$inspect_output"
            elif grep -Eqi 'manifest unknown|not found' <<< "$inspect_output"; then
              return 0
            else
              echo "$inspect_output" >&2
              return "$inspect_status"
            fi
          }

          ensure_immutable_alias() {
            local image_ref="$1"
            local existing_digest
            existing_digest="$(remote_digest "$image_ref")"
            if [[ -n "$existing_digest" && "$existing_digest" != "$IMAGE_DIGEST" ]]; then
              echo "Immutable image tag $image_ref already points to $existing_digest." >&2
              exit 1
            fi
            if [[ -z "$existing_digest" ]]; then
              docker buildx imagetools create \
                --prefer-index=false \
                --tag "$image_ref" "$IMAGE_NAME@$IMAGE_DIGEST"
            fi
          }

          ensure_immutable_alias "$IMAGE_NAME:sha-$TARGET_SHA"

      - name: Generate an SPDX SBOM from the published image
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}
          format: spdx-json
          output-file: container-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attest published image provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest published image SBOM
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: container-sbom.spdx.json
          push-to-registry: true

      - name: Record published container
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_CREATED: ${{ steps.publish.outputs.created }}
          TARGET_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo "## Published container"
            echo
            echo "- Image: \`$IMAGE_NAME:$TARGET_TAG\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo "- New immutable image: \`$IMAGE_CREATED\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish validated GitHub release
    if: github.event_name != 'pull_request'
    needs:
      - resolve
      - validate
      - tag
      - container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: ${{ needs.resolve.outputs.tag }}
          target_commitish: ${{ needs.resolve.outputs.target_sha }}
          name: Release ${{ needs.resolve.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.resolve.outputs.prerelease }}
          make_latest: ${{ needs.resolve.outputs.make_latest }}

      - name: Record published commit
        env:
          REQUESTED_TARGET: ${{ needs.resolve.outputs.requested_target }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          TARGET_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          {
            echo "## Published release"
            echo
            echo "- Requested target: \`$REQUESTED_TARGET\`"
            echo "- Validated and published SHA: \`$TARGET_SHA\`"
            echo "- Version tag: \`$TARGET_TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"

  channels:
    name: Move serialized release channels
    if: ${{ github.event_name != 'pull_request' && (needs.resolve.outputs.update_stable_tag == 'true' || needs.resolve.outputs.update_prerelease_tag == 'true' || needs.resolve.outputs.update_latest_tag == 'true') }}
    needs:
      - resolve
      - container
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-channel-publication
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/greyinghair/screenos_to_junos_converter

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Move requested container channels
        id: container_channels
        env:
          IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
          TARGET_TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE_TAG: ${{ needs.resolve.outputs.prerelease_tag }}
          STABLE_TAG: ${{ needs.resolve.outputs.stable_tag }}
          LATEST_TAG: ${{ needs.resolve.outputs.latest_tag }}
          UPDATE_STABLE_TAG: ${{ needs.resolve.outputs.update_stable_tag }}
          UPDATE_PRERELEASE_TAG: ${{ needs.resolve.outputs.update_prerelease_tag }}
          UPDATE_LATEST_TAG: ${{ needs.resolve.outputs.update_latest_tag }}
        run: |
          set -euo pipefail

          should_promote() {
            local channel_tag="$1"
            local pull_output
            local pull_status
            local current_version
            local newest_version

            set +e
            pull_output="$(docker pull "$IMAGE_NAME:$channel_tag" 2>&1)"
            pull_status=$?
            set -e
            if [[ "$pull_status" -ne 0 ]]; then
              if grep -Eqi 'manifest unknown|not found' <<< "$pull_output"; then
                return 0
              fi
              echo "$pull_output" >&2
              return "$pull_status"
            fi

            current_version="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
              "$IMAGE_NAME:$channel_tag")"
            [[ "$current_version" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
              echo "Channel $channel_tag has invalid version metadata '$current_version'." >&2
              return 2
            }
            [[ "$current_version" == "$TARGET_TAG" ]] && return 0
            newest_version="$(printf '%s\n%s\n' "$current_version" "$TARGET_TAG" \
              | sort -V | tail -n 1)"
            if [[ "$newest_version" != "$TARGET_TAG" ]]; then
              echo "Leaving $channel_tag at newer version $current_version; $TARGET_TAG is stale."
              return 1
            fi
          }

          move_channel() {
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "$IMAGE_NAME:$1" "$IMAGE_NAME@$IMAGE_DIGEST"
          }

          consider_channel() {
            local requested="$1"
            local channel_tag="$2"
            local output_name="$3"
            local promoted="false"
            local promotion_status=1
            if [[ "$requested" == "true" ]]; then
              if should_promote "$channel_tag"; then
                promotion_status=0
              else
                promotion_status=$?
              fi
              if [[ "$promotion_status" -eq 0 ]]; then
                move_channel "$channel_tag"
                promoted="true"
              elif [[ "$promotion_status" -ne 1 ]]; then
                return "$promotion_status"
              fi
            fi
            echo "$output_name=$promoted" >> "$GITHUB_OUTPUT"
          }

          consider_channel "$UPDATE_STABLE_TAG" "$STABLE_TAG" stable
          consider_channel "$UPDATE_PRERELEASE_TAG" "$PRERELEASE_TAG" prerelease
          consider_channel "$UPDATE_LATEST_TAG" "$LATEST_TAG" latest

      - name: Move requested Git channels
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_TAG_PUSH_TOKEN != '' && secrets.RELEASE_TAG_PUSH_TOKEN || github.token }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          TARGET_TAG: ${{ needs.resolve.outputs.tag }}
          PRERELEASE_TAG: ${{ needs.resolve.outputs.prerelease_tag }}
          STABLE_TAG: ${{ needs.resolve.outputs.stable_tag }}
          LATEST_TAG: ${{ needs.resolve.outputs.latest_tag }}
          UPDATE_STABLE_TAG: ${{ steps.container_channels.outputs.stable }}
          UPDATE_PRERELEASE_TAG: ${{ steps.container_channels.outputs.prerelease }}
          UPDATE_LATEST_TAG: ${{ steps.container_channels.outputs.latest }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          push_remote="https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          move_tag() {
            local floating_tag="$1"
            git tag -f -a \
              -m "Move $floating_tag -> $TARGET_TAG ($TARGET_SHA)" \
              -- "$floating_tag" "$TARGET_SHA"
            git push "$push_remote" "refs/tags/$floating_tag" --force
          }

          if [[ "$UPDATE_STABLE_TAG" == "true" ]]; then
            move_tag "$STABLE_TAG"
          fi
          if [[ "$UPDATE_PRERELEASE_TAG" == "true" ]]; then
            move_tag "$PRERELEASE_TAG"
          fi
          if [[ "$UPDATE_LATEST_TAG" == "true" ]]; then
            move_tag "$LATEST_TAG"
          fi

      - name: Verify every requested channel
        env:
          IMAGE_DIGEST: ${{ needs.container.outputs.image_digest }}
          TARGET_SHA: ${{ needs.resolve.outputs.target_sha }}
          PRERELEASE_TAG: ${{ needs.resolve.outputs.prerelease_tag }}
          STABLE_TAG: ${{ needs.resolve.outputs.stable_tag }}
          LATEST_TAG: ${{ needs.resolve.outputs.latest_tag }}
          UPDATE_STABLE_TAG: ${{ steps.container_channels.outputs.stable }}
          UPDATE_PRERELEASE_TAG: ${{ steps.container_channels.outputs.prerelease }}
          UPDATE_LATEST_TAG: ${{ steps.container_channels.outputs.latest }}
        run: |
          set -euo pipefail

          verify_channel() {
            local channel_tag="$1"
            local image_digest
            local git_sha
            image_digest="$(docker buildx imagetools inspect "$IMAGE_NAME:$channel_tag" \
              | awk '$1 == "Digest:" {print $2; exit}')"
            git_sha="$(git ls-remote --tags origin "refs/tags/${channel_tag}^{}" \
              | awk '{print $1}')"
            [[ "$image_digest" == "$IMAGE_DIGEST" ]] || {
              echo "Image channel $channel_tag points to $image_digest, expected $IMAGE_DIGEST." >&2
              exit 1
            }
            [[ "$git_sha" == "$TARGET_SHA" ]] || {
              echo "Git channel $channel_tag points to $git_sha, expected $TARGET_SHA." >&2
              exit 1
            }
          }

          if [[ "$UPDATE_STABLE_TAG" == "true" ]]; then
            verify_channel "$STABLE_TAG"
          fi
          if [[ "$UPDATE_PRERELEASE_TAG" == "true" ]]; then
            verify_channel "$PRERELEASE_TAG"
          fi
          if [[ "$UPDATE_LATEST_TAG" == "true" ]]; then
            verify_channel "$LATEST_TAG"
          fi
