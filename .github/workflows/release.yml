name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: 1.2.3 or v1.2.3)"
        required: true
        type: string
      prerelease:
        description: "Mark this as a prerelease"
        required: false
        default: false
        type: boolean
      stable_tag:
        description: "Floating stable tag name"
        required: false
        default: stable
        type: string
      latest_tag:
        description: "Floating latest tag name"
        required: false
        default: latest
        type: string
      update_stable_tag:
        description: "Move the stable floating tag to this release"
        required: false
        default: false
        type: boolean
      update_latest_tag:
        description: "Move the latest floating tag to this release"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail

          bool_or_default() {
            local raw="$1"
            local fallback="$2"
            local v="${raw:-$fallback}"
            case "${v,,}" in
              true|1|yes|y) echo "true" ;;
              false|0|no|n) echo "false" ;;
              *) echo "$fallback" ;;
            esac
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
            # Accept either 1.2.3 / 1.2.3-rc.1 or v1.2.3 / V1.2.3-rc.1.
            NORMALIZED_VERSION="${RAW_VERSION#v}"
            NORMALIZED_VERSION="${NORMALIZED_VERSION#V}"

            [[ "$NORMALIZED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] || {
              echo "Invalid version '${RAW_VERSION}'. Expected semver-like value such as 1.2.3, v1.2.3, or v1.2.3-rc.1" >&2
              exit 1
            }

            TAG="v${NORMALIZED_VERSION}"

            PRERELEASE="${{ github.event.inputs.prerelease }}"
            STABLE_TAG="${{ github.event.inputs.stable_tag }}"
            LATEST_TAG="${{ github.event.inputs.latest_tag }}"
            UPDATE_STABLE_TAG="$(bool_or_default "${{ github.event.inputs.update_stable_tag }}" "true")"
            UPDATE_LATEST_TAG="$(bool_or_default "${{ github.event.inputs.update_latest_tag }}" "true")"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" == *-* ]]; then
              PRERELEASE="true"
            else
              PRERELEASE="false"
            fi

            STABLE_TAG="stable"
            LATEST_TAG="latest"
            UPDATE_STABLE_TAG="true"
            UPDATE_LATEST_TAG="true"

            # Optional repository-level defaults for push-triggered releases.
            if [[ -f ".github/release-tags.env" ]]; then
              # shellcheck source=/dev/null
              source .github/release-tags.env
            fi

            STABLE_TAG="${STABLE_TAG:-stable}"
            LATEST_TAG="${LATEST_TAG:-latest}"
            UPDATE_STABLE_TAG="$(bool_or_default "${UPDATE_STABLE_TAG:-true}" "true")"
            UPDATE_LATEST_TAG="$(bool_or_default "${UPDATE_LATEST_TAG:-true}" "true")"
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "stable_tag=$STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "update_stable_tag=$UPDATE_STABLE_TAG" >> "$GITHUB_OUTPUT"
          echo "update_latest_tag=$UPDATE_LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Release ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.prerelease == 'true' && 'false' || 'true' }}

      - name: Move floating tags
        if: ${{ steps.meta.outputs.update_stable_tag == 'true' || steps.meta.outputs.update_latest_tag == 'true' }}
        env:
          RELEASE_TAG_PUSH_TOKEN: ${{ secrets.RELEASE_TAG_PUSH_TOKEN }}
          TARGET_TAG: ${{ steps.meta.outputs.tag }}
          STABLE_TAG: ${{ steps.meta.outputs.stable_tag }}
          LATEST_TAG: ${{ steps.meta.outputs.latest_tag }}
          UPDATE_STABLE_TAG: ${{ steps.meta.outputs.update_stable_tag }}
          UPDATE_LATEST_TAG: ${{ steps.meta.outputs.update_latest_tag }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUSH_REMOTE="origin"
          if [[ "${UPDATE_STABLE_TAG}" == "true" || "${UPDATE_LATEST_TAG}" == "true" ]]; then
            if [[ -z "${RELEASE_TAG_PUSH_TOKEN:-}" ]]; then
              echo "Floating tag updates require RELEASE_TAG_PUSH_TOKEN secret (contents+workflows write)." >&2
              echo "Disable update_stable_tag/update_latest_tag for this run or add the secret." >&2
              exit 1
            fi
          fi

          if [[ -n "${RELEASE_TAG_PUSH_TOKEN:-}" ]]; then
            PUSH_REMOTE="https://x-access-token:${RELEASE_TAG_PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          # Ensure checkout's default token header cannot override PAT-based pushes.
          git config --local --unset-all http.https://github.com/.extraheader || true

          move_tag() {
            local floating_tag="$1"
            [[ -n "$floating_tag" ]] || return 0
            git tag -fa "$floating_tag" "$TARGET_TAG" -m "Move $floating_tag -> $TARGET_TAG"
            if ! git push "$PUSH_REMOTE" "refs/tags/$floating_tag" --force; then
              echo "Failed to move floating tag '$floating_tag' to '$TARGET_TAG'." >&2
              echo "If this release points to commits that modify files under .github/workflows/," >&2
              echo "set repository secret RELEASE_TAG_PUSH_TOKEN to a token with workflows+contents write permissions." >&2
              exit 1
            fi
          }

          if [[ "${UPDATE_STABLE_TAG}" == "true" ]]; then
            move_tag "$STABLE_TAG"
          fi

          if [[ "${UPDATE_LATEST_TAG}" == "true" ]]; then
            move_tag "$LATEST_TAG"
          fi
